<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kips Restaurant and Ice Cream Parlor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .navbar {
            background-color: rgba(0, 0, 0, 0.85) !important;
            padding: 1.2rem 0;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            transition: background-color 0.4s ease;
        }
        .navbar.scrolled {
            background-color: #000 !important;
        }
        .navbar-brand img {
            height: 65px;
            transition: transform 0.4s ease;
        }
        .navbar-brand img:hover {
            transform: rotate(5deg) scale(1.1);
        }
        .nav-link {
            color: #fff !important;
            font-weight: 600;
            margin: 0 1.2rem;
            position: relative;
            transition: color 0.4s ease, transform 0.4s ease;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 3px;
            bottom: -6px;
            left: 0;
            background-color: #dc3545;
            transition: width 0.4s ease;
        }
        .nav-link:hover::after {
            width: 100%;
        }
        .nav-link:hover {
            color: #dc3545 !important;
            transform: translateY(-2px);
        }
        .order-btn {
            background-color: #dc3545;
            border: none;
            font-weight: bold;
            padding: 0.6rem 1.8rem;
            transition: background-color 0.4s ease, transform 0.4s ease, box-shadow 0.4s ease;
            box-shadow: 0 4px 8px rgba(220, 53, 69, 0.3);
        }
        .order-btn:hover {
            background-color: #c82333;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(200, 35, 51, 0.4);
        }
        .hero {
            background-image: url('https://i.ibb.co/tMFBJ6g4/KIPSMW-123155.jpg');
            background-size: cover;
            background-position: center;
            height: calc(100vh - 80px);
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.3));
            z-index: 1;
        }
        .hero-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            z-index: 2;
            opacity: 0;
            animation: fadeInUp 2s ease forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            margin-bottom: 1.5rem;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.6);
            letter-spacing: 1px;
        }
        .hero p {
            font-size: 1.8rem;
            font-weight: 400;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
        }
        .hero-btn {
            background-color: #dc3545;
            border: none;
            font-weight: bold;
            padding: 0.8rem 2.5rem;
            transition: background-color 0.4s ease, transform 0.4s ease;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .hero-btn:hover {
            background-color: #c82333;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="https://i.ibb.co/tMFBJ6g4/KIPSMW-123155.jpg" alt="Kips Logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">ABOUT US</a></li>
                    <li class="nav-item"><a class="nav-link" href="menu.html">MENU</a></li>
                    <li class="nav-item"><a class="nav-link" href="find.html">FIND A KIPS</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">FOOD GALLERY</a></li>
                    <li class="nav-item"><a class="nav-link" href="feedback.html">FEEDBACK</a></li>
                    <li class="nav-item"><a class="nav-link" href="ads.html">ADS</a></li>
                </ul>
                <button class="btn order-btn text-white">ORDER: +265 (0) 883 999 999</button>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>Welcome to Kips</h1>
            <p>Indulge in Delicious Meals & Refreshing Ice Creams</p>
            <a href="menu.html" class="btn hero-btn text-white">Explore Menu</a>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        window.addEventListener('scroll', function() {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
